<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Zuni Couros</title>
<style>
  :root {
    --marrom: #7a4a2b;
    --marrom-escuro: #52301a;
    --vinho: #6e2430;
    --creme: #faf4ea;
    --texto: #2b2320;
    --texto-suave: #6b5c4e;
    --borda: #e4d7c4;
    --whatsapp: #25d366;
    --largura-max: 520px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    padding: 0;
    background: #ddd0bd;
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #app {
    max-width: var(--largura-max);
    margin: 0 auto;
    background: var(--creme);
    min-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,.15);
  }

  /* ---------- topo ---------- */
  #topo {
    position: sticky;
    top: 0;
    z-index: 30;
    background: linear-gradient(135deg, var(--marrom), var(--marrom-escuro));
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }
  #topo h1 {
    margin: 0;
    padding: 14px 16px 8px;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .2px;
    text-align: center;
  }
  #topo h1 span { opacity: .85; font-weight: 500; font-size: 12.5px; display: block; margin-top: 4px; }
  #menu {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 12px;
    scrollbar-width: none;
  }
  #menu::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    background: rgba(255,255,255,.14);
    color: #fff;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
    transition: background .15s ease, transform .1s ease;
    cursor: pointer;
  }
  .pill:active { transform: scale(.96); }
  .pill.ativo { background: #fff; color: var(--marrom-escuro); }

  /* ---------- secoes / grid ---------- */
  .secao { scroll-margin-top: 108px; padding: 18px 14px 6px; }
  .secao-titulo {
    margin: 0 0 3px;
    font-size: 17px;
    font-weight: 800;
    color: var(--marrom-escuro);
  }
  .secao-subtitulo {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--texto-suave);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: 8px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    padding: 0;
    box-shadow: 0 2px 6px rgba(43,35,32,.08);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:active { transform: scale(.97); }
  .card-foto-wrap { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #f1e9dc; overflow: hidden; }
  .card-foto-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-badge-fotos {
    position: absolute;
    right: 6px;
    top: 6px;
    background: rgba(43,35,32,.62);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .card-info { padding: 8px 10px 10px; }
  .card-cor {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.25;
    margin: 0 0 5px;
  }
  .card-tamanhos {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .tam-badge {
    background: var(--creme);
    border: 1px solid var(--borda);
    color: var(--texto-suave);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .card-sem-tamanho { font-size: 10.5px; color: var(--texto-suave); }

  /* ---------- lightbox ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(20,14,10,.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #lightbox.aberto { display: flex; }
  .lb-fechar {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
  }
  .lb-carrossel {
    width: 100%;
    max-width: var(--largura-max);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
  }
  .lb-carrossel img {
    width: 100%;
    max-height: 62vh;
    object-fit: contain;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lb-prev { left: 6px; }
  .lb-next { right: 6px; }
  .lb-dots { display: flex; gap: 6px; justify-content: center; padding: 12px 0 4px; }
  .lb-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.32); }
  .lb-dot.ativo { background: #fff; }
  .lb-info {
    width: 100%;
    max-width: var(--largura-max);
    padding: 6px 20px 26px;
    text-align: center;
  }
  .lb-cor { color: #fff; font-size: 16px; font-weight: 800; margin: 0 0 4px; }
  .lb-formato { color: rgba(255,255,255,.65); font-size: 12.5px; margin: 0 0 10px; }
  .lb-tamanhos { color: rgba(255,255,255,.85); font-size: 12px; margin: 0 0 18px; }
  .lb-whats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: var(--whatsapp);
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
    padding: 13px 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
  }
  .lb-whats svg { width: 20px; height: 20px; flex: 0 0 auto; }

  /* ---------- rodape ---------- */
  #rodape {
    background: var(--marrom-escuro);
    color: #f3e6d8;
    text-align: center;
    padding: 26px 16px 34px;
    font-size: 12.5px;
    line-height: 1.7;
  }
  #rodape a { color: #f0c9a0; text-decoration: none; font-weight: 700; }
  #voltar-topo {
    position: fixed;
    right: max(14px, calc(50vw - (var(--largura-max) / 2) + 14px));
    bottom: 14px;
    z-index: 25;
    background: var(--marrom-escuro);
    color: #fff;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    border: none;
    cursor: pointer;
  }
  #voltar-topo.visivel { opacity: 1; pointer-events: auto; }
</style>
</head>

function textoMensagem(item, grupo) {
  const cor = item.cor_display;
  const txt = `Olá! Tenho interesse neste ${grupo.titulo} — cor ${cor}. Pode confirmar tamanhos e preços disponíveis?\n${item.link}`;
  return txt;
}

function linkWhats(item, grupo) {
  return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(textoMensagem(item, grupo))}`;

function badgesTamanho(item) {

}

  const conteudo = document.getElementById('conteudo');

  CATALOGO.forEach(grupo => {
    const pill = document.createElement('a');
    pill.className = 'pill';
    pill.href = '#' + grupo.formato;
    pill.dataset.anchor = grupo.formato;
    pill.textContent = grupo.nome;
    menu.appendChild(pill);

    const secao = document.createElement('section');
    secao.className = 'secao';
    secao.id = grupo.formato;

    const titulo = document.createElement('h2');
    titulo.className = 'secao-titulo';
    titulo.textContent = grupo.titulo;
    secao.appendChild(titulo);

    const subtitulo = document.createElement('p');
    subtitulo.className = 'secao-subtitulo';
    subtitulo.textContent = `${grupo.itens.length} ${grupo.itens.length === 1 ? 'cor disponível' : 'cores disponíveis'}`;
    secao.appendChild(subtitulo);

    const grid = document.createElement('div');
    grid.className = 'grid';

    grupo.itens.forEach((item, idx) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.addEventListener('click', () => abrirLightbox(grupo.formato, idx));

      card.innerHTML = `
        <div class="card-foto-wrap">
          <img src="${item.images[0]}" loading="lazy" alt="${grupo.titulo} cor ${item.cor_display}">
          ${item.images.length > 1 ? `<span class="card-badge-fotos">📷 ${item.images.length}</span>` : ''}
        </div>
        <div class="card-info">
          <p class="card-cor">${item.cor_display}</p>
          <div class="card-tamanhos">${badgesTamanho(item)}</div>
        </div>`;
      grid.appendChild(card);
    });

    secao.appendChild(grid);
    conteudo.appendChild(secao);
  });

  const rodapeWhats = document.getElementById('rodape-whats');
  rodapeWhats.href = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent('Olá! Vim pelo catálogo da Zuni Couros e gostaria de mais informações.')}`;
}

/* ---------- lightbox / carrossel ---------- */
let lbGrupo = null, lbItem = null, lbFoto = 0;

function abrirLightbox(formato, idx) {
  lbGrupo = CATALOGO.find(g => g.formato === formato);
  lbItem = lbGrupo.itens[idx];
  lbFoto = 0;
  atualizarLightbox();
  document.getElementById('lightbox').classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
  document.body.style.overflow = '';
}

function atualizarLightbox() {
  document.getElementById('lb-img').src = lbItem.images[lbFoto];
  document.getElementById('lb-img').alt = `${lbGrupo.titulo} cor ${lbItem.cor_display} - foto ${lbFoto + 1}`;
  document.getElementById('lb-cor').textContent = lbItem.cor_display;
  document.getElementById('lb-formato').textContent = lbGrupo.titulo;
  document.getElementById('lb-tamanhos').textContent = lbItem.qtds && lbItem.qtds.length
    ? 'Tamanhos: ' + lbItem.qtds.map(q => q + ' un').join(' · ')
    : 'Consulte os tamanhos disponíveis';
  document.getElementById('lb-whats').href = linkWhats(lbItem, lbGrupo);

  const dots = document.getElementById('lb-dots');
  dots.innerHTML = '';
  if (lbItem.images.length > 1) {
    lbItem.images.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'lb-dot' + (i === lbFoto ? ' ativo' : '');
      dots.appendChild(d);
    });
  }
  const mostrarSetas = lbItem.images.length > 1;
  document.querySelector('.lb-prev').style.display = mostrarSetas ? 'flex' : 'none';
  document.querySelector('.lb-next').style.display = mostrarSetas ? 'flex' : 'none';
}

function proximaFoto(delta) {
  if (!lbItem || lbItem.images.length < 2) return;
  lbFoto = (lbFoto + delta + lbItem.images.length) % lbItem.images.length;
  atualizarLightbox();
}

function iniciarInteracoes() {
  document.querySelector('.lb-fechar').addEventListener('click', fecharLightbox);
  document.querySelector('.lb-prev').addEventListener('click', () => proximaFoto(-1));
  document.querySelector('.lb-next').addEventListener('click', () => proximaFoto(1));
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') fecharLightbox();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('aberto')) return;
    if (e.key === 'Escape') fecharLightbox();
    if (e.key === 'ArrowLeft') proximaFoto(-1);
    if (e.key === 'ArrowRight') proximaFoto(1);
  });

  // swipe simples no carrossel
  let touchStartX = null;
  const carrossel = document.querySelector('.lb-carrossel');
  carrossel.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
  carrossel.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) proximaFoto(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, {passive: true});

  // menu ativo conforme scroll
  const pills = Array.prototype.slice.call(document.querySelectorAll('#menu .pill'));
  const secoes = Array.prototype.slice.call(document.querySelectorAll('.secao'));
  const botaoTopo = document.getElementById('voltar-topo');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const id = entry.target.id;
        pills.forEach(p => p.classList.toggle('ativo', p.dataset.anchor === id));
      });
    }, { rootMargin: '-120px 0px -70% 0px', threshold: 0 });
    secoes.forEach(s => obs.observe(s));
  }
  window.addEventListener('scroll', () => {
    botaoTopo.classList.toggle('visivel', window.scrollY > 900);
  }, { passive: true });
}

montarPagina();
iniciarInteracoes();
</script>
